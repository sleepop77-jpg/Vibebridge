name: Build APK
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle 9.3.1 CLI
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Repair missing Gradle wrapper
        id: wrapfix
        run: |
          if [ ! -f gradlew ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            chmod +x gradlew
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
            chmod +x gradlew
          fi
      - name: Commit wrapper back to repo
        if: steps.wrapfix.outputs.missing == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          git commit -m "chore: add gradle wrapper [skip ci]"
          git push
      - name: Generate missing debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibebridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
